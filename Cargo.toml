[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Liam Kirton <liam@int3.ws>"]
description = "Implements querying and stream processing of results from Azure Data Explorer (Kusto) clusters. It is designed for KQL queries that return large datasets."
license = "MIT"
repository = "https://github.com/liamkirton/kusto_stream"

[workspace.dependencies]
kusto_stream = { path = "crates/kusto_stream" }
kusto_stream_macros = { path = "crates/kusto_stream_macros" }

anyhow = "1.0.104"
azure_core = "1.1.0"
azure_identity = "1.0.0"
bytes = "1.12.1"
chrono = { version = "0.4", default-features = false }
memchr = "2.8.3"
proc-macro2 = "1"
quote = "1"
regex = "1.13"
reqwest = "0.13.4"
serde = "1.0.229"
serde_json = "1.0.151"
syn = "2"
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1"
